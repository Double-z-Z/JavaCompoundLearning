# Dev Profile: H2 内存数据库 + 开发友好配置
# 启动方式: java -jar app.jar --spring.profiles.active=dev

spring:
  datasource:
    url: jdbc:h2:mem:devops_dashboard;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password:
    driver-class-name: org.h2.Driver
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
    show-sql: true

logging:
  level:
    root: INFO
    com.devops.dashboard: DEBUG
    org.hibernate.SQL: DEBUG

devops:
  profile:
    mode: personal
  infrastructure:
    provider-type: docker-compose
