# Test Configuration (H2 in-memory database)

spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: 
    driver-class-name: org.h2.Driver
    
  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
    
  h2:
    console:
      enabled: true
      path: /h2-console

devops:
  profile:
    mode: personal
    
  infrastructure:
    provider-type: docker-compose
    docker-compose:
      timeout-seconds: 60
      
  experiment:
    default-max-lifetime: "30m"  # Shorter for tests
    archive-directory: ./build/test-spikes

logging:
  level:
    root: WARN
    com.devops.dashboard: DEBUG
    org.hibernate.SQL: DEBUG
