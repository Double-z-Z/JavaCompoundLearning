version: '3.8'

services:
  # ==================== MySQL 主库 ====================
  mysql-master:
    image: mysql:8.0
    container_name: sharding-master
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: order_db
    ports:
      - "3307:3306"
    volumes:
      - master_data:/var/lib/mysql
      - ./docker/master/conf.d:/etc/mysql/conf.d
      - ./docker/master/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==================== MySQL 从库 ====================
  mysql-slave:
    image: mysql:8.0
    container_name: sharding-slave
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: order_db
    ports:
      - "3308:3306"
    volumes:
      - slave_data:/var/lib/mysql
      - ./docker/slave/conf.d:/etc/mysql/conf.d
      - ./docker/slave/init:/docker-entrypoint-initdb.d
    depends_on:
      mysql-master:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  master_data:
  slave_data:
