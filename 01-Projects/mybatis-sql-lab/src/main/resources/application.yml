server:
  port: 8089

spring:
  main:
    web-application-type: servlet
    allow-circular-references: true
  sql:
    init:
      mode: never
  # 禁用 Spring Boot 默认的 DataSource 自动装配（由 ShardingDataSourceConfig 手动管理）
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration

# 暴露 Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,metrics
  endpoint:
    health:
      show-details: always

# ── 迁移开关 ──
# true  = MigrationRoutingDataSource 接管，单库 → 分片迁移中
# false = ShardingSphere 直连，迁移已完成
migration:
  active: true

# ── 分片配置 ──
# 所有分片规则见 classpath:sharding-config.yml
# 扩分片：修改 sharding-config.yml 中注释标注的行，重启即可

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      id-type: auto
  mapper-locations:
    - classpath:com/example/order/infrastructure/persistence/sharding/*.xml
