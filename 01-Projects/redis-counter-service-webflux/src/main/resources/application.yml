spring:
  application:
    name: redis-counter-service-webflux

  # Redis Cluster 配置
  data:
    redis:
      cluster:
        nodes: ${REDIS_CLUSTER_NODES:10.0.0.102:6379,10.0.0.103:6379,10.0.0.104:6379,10.0.0.105:6379,10.0.0.106:6379,10.0.0.107:6379}
        max-redirects: 3
      password: ${REDIS_PASSWORD:}

# 服务器配置（WebFlux 使用 Netty，默认 8080，与 MVC 版本二选一）
server:
  port: 8080

# 日志配置
logging:
  level:
    com.example.counter: INFO
    org.springframework.data.redis: INFO
    reactor.netty: INFO

# 库存扣减策略配置
stock:
  decrement:
    strategy: atomic  # atomic | raw

# Sentinel 限流+熔断配置
sentinel:
  enabled: true
  spike:
    resource-name: spike
    qps-threshold: 10000          # QPS 限流阈值
    # L1 熔断配置（慢调用比例）
    degrade:
      slow-ratio-threshold: 0.5   # 慢调用比例阈值 50%
      min-request-amount: 5       # 最小请求数
      max-processing-time: 3000   # 最大响应时间 3000ms
      time-window: 30             # 熔断窗口 30s
  redis:
    resource-name: redis_decrement
    # L2 熔断配置（异常比例）
    degrade:
      exception-ratio-threshold: 0.5  # 异常比例阈值 50%
      min-request-amount: 10          # 最小请求数
      time-window: 30                # 熔断窗口 30s
  mq:
    resource-name: mq_send_order
    # L3 熔断配置（异常比例）
    degrade:
      exception-ratio-threshold: 0.4  # 异常比例阈值 40%
      min-request-amount: 10          # 最小请求数
      time-window: 60                 # 熔断窗口 60s（MQ恢复较慢）

# RabbitMQ 削峰配置
rabbitmq:
  host: ${RABBITMQ_HOST:localhost}
  port: ${RABBITMQ_PORT:5672}
  username: ${RABBITMQ_USERNAME:guest}
  password: ${RABBITMQ_PASSWORD:guest}
  spike:
    exchange: spike-exchange
    queue: spike-order-queue
    routing-key: spike.order.create
    prefetch: 100
    concurrent-consumers: 5