spring:
  application:
    name: redis-counter-service-webflux

  # Redis Cluster 配置
  data:
    redis:
      cluster:
        nodes: ${REDIS_CLUSTER_NODES:10.0.0.102:6379,10.0.0.103:6379,10.0.0.104:6379,10.0.0.105:6379,10.0.0.106:6379,10.0.0.107:6379}
        max-redirects: 3
      password: ${REDIS_PASSWORD:}

# 服务器配置（WebFlux 使用 Netty，默认 8080，与 MVC 版本二选一）
server:
  port: 8080

# 日志配置
logging:
  level:
    com.example.counter: INFO
    org.springframework.data.redis: INFO
    reactor.netty: INFO

# 库存扣减策略配置
stock:
  decrement:
    strategy: atomic  # atomic | raw

# Sentinel 限流配置
sentinel:
  enabled: true
  spike:
    resource-name: spike
    qps-threshold: 10000          # 单用户 QPS 阈值
    cluster-threshold: 200000    # 集群总 QPS 阈值

# RabbitMQ 削峰配置
rabbitmq:
  host: ${RABBITMQ_HOST:localhost}
  port: ${RABBITMQ_PORT:5672}
  username: ${RABBITMQ_USERNAME:guest}
  password: ${RABBITMQ_PASSWORD:guest}
  spike:
    exchange: spike-exchange
    queue: spike-order-queue
    routing-key: spike.order.create
    prefetch: 100
    concurrent-consumers: 5