spring:
  application:
    name: redis-counter-service
  
  # Redis Cluster 配置
  data:
    redis:
      cluster:
        nodes: ${REDIS_CLUSTER_NODES:10.0.0.102:6379,10.0.0.103:6379,10.0.0.104:6379,10.0.0.105:6379,10.0.0.106:6379,10.0.0.107:6379}
        max-redirects: 3
      password: ${REDIS_PASSWORD:}
      
      # Lettuce 连接池配置
      lettuce:
        pool:
          max-active: 100         # 最大连接数（调优）
          max-idle: 50           # 最大空闲连接（调优）
          min-idle: 20           # 最小空闲连接（调优）
          max-wait: 1000ms       # 最大等待时间（调优）
        shutdown-timeout: 100ms
        cluster:
          refresh:
            adaptive: true        # 自适应刷新拓扑
            period: 60s           # 定期刷新间隔

# 服务器配置
server:
  port: 8080
  tomcat:
    threads:
      max: 200
      min-spare: 10

# 日志配置
logging:
  level:
    com.example.counter: DEBUG
    org.springframework.data.redis: INFO

# 库存扣减策略配置
stock:
  decrement:
    strategy: atomic  # atomic | raw
